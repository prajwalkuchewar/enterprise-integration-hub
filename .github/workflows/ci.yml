name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: .

      - name: Build Angular frontend
        run: npm run build --workspace @eih/frontend
        working-directory: .

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Restore dependencies
        run: dotnet restore EnterpriseIntegrationHub.sln

      - name: Verify formatting
        run: dotnet format EnterpriseIntegrationHub.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build EnterpriseIntegrationHub.sln --configuration Release --no-restore /warnaserror

      - name: Run tests
        run: >
          dotnet test EnterpriseIntegrationHub.sln --configuration Release --no-build
          --collect "XPlat Code Coverage"
          --logger "trx;LogFilePrefix=test-results"
          --results-directory TestResults

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.4.6
        with:
          reports: backend/TestResults/**/coverage.cobertura.xml
          targetdir: backend/TestResults/coverage-report
          reporttypes: HtmlInline;Cobertura

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/TestResults/coverage-report
          if-no-files-found: ignore
